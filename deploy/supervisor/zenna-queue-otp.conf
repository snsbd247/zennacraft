; Dedicated OTP queue worker. This process listens ONLY on the `otp` queue
; so a login code is never stuck behind a bulk campaign send — see
; docs/queue-setup.md for why this is a separate process rather than just
; queue priority on one worker.
;
; Adjust `directory`, `user`, and PHP binary path for your server, then:
;   sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start zenna-queue-otp:*

[program:zenna-queue-otp]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/zenna-craft
command=php artisan queue:work database --queue=otp --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/zenna-craft/storage/logs/queue-otp.log
stopwaitsecs=10
