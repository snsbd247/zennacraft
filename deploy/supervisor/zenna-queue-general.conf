; General queue worker for everything that isn't a login code: order status,
; verification, review, and recovery messages (transactional) plus
; campaign/segment/coupon blasts (bulk). Listed in priority order — this
; worker always drains `transactional` before `bulk`, but neither one can
; ever delay `otp`, which has its own dedicated worker
; (zenna-queue-otp.conf).
;
; Adjust `directory`, `user`, and PHP binary path for your server, then:
;   sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start zenna-queue-general:*

[program:zenna-queue-general]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/zenna-craft
command=php artisan queue:work database --queue=transactional,bulk --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/zenna-craft/storage/logs/queue-general.log
stopwaitsecs=10
